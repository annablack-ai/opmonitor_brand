    /* ── Shell ── */
    .shell{height:100%;background:#fff}
    .scr{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
    .pg{min-height:100svh;scroll-snap-align:start;overflow-x:hidden}

    /* ── Horizontal track ── */
    .xtr{display:flex;gap:12px;overflow-x:auto;padding:0 20px;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
      -ms-overflow-style:none;scrollbar-width:none}
    .xtr::-webkit-scrollbar{display:none}
    .xc{scroll-snap-align:center;flex-shrink:0;width:82vw;
      transition:transform .25s ease,opacity .25s ease,box-shadow .25s ease}
    .xc.a{transform:scale(1);opacity:1;
      box-shadow:0 6px 32px rgba(37,99,235,.15)}
    .xc.i{transform:scale(.95);opacity:.6}

    /* ── Matrix: fixed feature column + product swipe ── */
    .mx-wrap{display:flex;align-items:stretch}
    .mx-stage{position:relative}
    .mx-float{
      position:absolute;top:8px;right:8px;z-index:3;
      display:flex;align-items:center;gap:6px;
      padding:4px 8px;border-radius:999px;
      border:1px solid #dbeafe;background:rgba(255,255,255,.95);
      box-shadow:0 4px 12px rgba(37,99,235,.12);
      pointer-events:none
    }
    .mx-float-lbl{font-size:10px;color:#64748b;font-weight:600}
    .mx-float-val{font-size:11px;color:#2563eb;font-weight:700;white-space:nowrap}
    .mx-left{width:46%;max-width:190px;min-width:156px;
      flex-shrink:0;border-right:1px solid #e2e8f0;background:#f8fafc}
    .mx-track{min-width:0;flex:1;display:flex;overflow-x:auto;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
      -ms-overflow-style:none;scrollbar-width:none}
    .mx-track::-webkit-scrollbar{display:none}
    .mx-col{flex:0 0 100%;min-width:100%;scroll-snap-align:start;
      transition:opacity .25s ease}
    .mx-col.a{opacity:1}
    .mx-col.i{opacity:.45}
    .mx-cell{display:flex;align-items:center;padding:8px 10px;
      min-height:42px;border-bottom:1px solid #f1f5f9;
      font-size:11px;line-height:1.3}
    .mx-head{min-height:48px;font-size:12px;font-weight:700;
      color:#fff;background:#2563eb;border-bottom-color:transparent}
    .mx-left .mx-head{background:#0f172a}
    .mx-left .mx-item{color:#334155;font-weight:600}
    .mx-sec{min-height:34px;font-size:10px;font-weight:700;
      letter-spacing:.08em;text-transform:uppercase;color:#64748b;
      background:#f1f5f9}
    .mx-val{justify-content:center;font-size:14px;font-weight:700}
    .mx-empty{color:#cbd5e1}
    .mx-yes{color:#2563eb}
    .mx-no{color:#94a3b8}

    /* ── Stagger fade ── */
    .fi{opacity:0;transform:translateY(18px);
      transition:opacity .5s ease,transform .5s ease}
    .fi.on{opacity:1;transform:translateY(0)}

    /* ── Animations ── */
    @keyframes BNC{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
    .bnc{animation:BNC 1.8s ease-in-out infinite}
    @keyframes FLT{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .flt{animation:FLT 3.5s ease-in-out infinite}

    /* ── Desktop phone shell ── */
    @media(min-width:768px){

        justify-content:center;min-height:100vh;padding:24px}

        transform:translateX(-50%);width:120px;height:28px;
        background:#111827;border-radius:0 0 18px 18px;z-index:100}
    }

  methods: {
    initStagger() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const i = Number(e.target.dataset.fi || 0);
            setTimeout(() => { this.fiShow[i] = true; }, i * 140);
          }
        });
      }, { threshold: 0.15 });
      nextTick(() => {
        document.querySelectorAll('[data-fi]').forEach(el => io.observe(el));
      });
    },

    initTrack(refName, key) {
      const t = this.$refs[refName];
      if (!t) return;
      const cards = [...t.querySelectorAll('[data-hc]')];
      const update = () => {
        const ctr = t.scrollLeft + t.clientWidth / 2;
        let min = 1e9, idx = 0;
        cards.forEach((c, i) => {
          const d = Math.abs(c.offsetLeft + c.clientWidth / 2 - ctr);
          if (d < min) { min = d; idx = i; }
        });
        this[key] = idx;
      };

      // Avoid duplicate listeners when initTrack is re-run on resize.
      if (!t._trackListener) {
        t._trackListener = () => {
          if (typeof t._trackUpdate === 'function') t._trackUpdate();
        };
        t.addEventListener('scroll', t._trackListener, { passive: true });
      }
      t._trackUpdate = update;
      update();
    },

    goCard(refName, i) {
      const t = this.$refs[refName];
      if (!t) return;
      const c = [...t.querySelectorAll('[data-hc]')][i];
      if (!c) return;
      t.scrollTo({ left: c.offsetLeft - (t.clientWidth - c.clientWidth) / 2, behavior: 'smooth' });
    },
